name: Build Borban ShopManager APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify permanent signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.BORBAN_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.BORBAN_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BORBAN_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BORBAN_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing BORBAN_ANDROID_KEYSTORE_B64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing BORBAN_ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing BORBAN_ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing BORBAN_ANDROID_KEY_PASSWORD" && exit 1)

      - name: Prepare permanent signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.BORBAN_ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/borban-shopmanager-release.jks"
          chmod 600 "$RUNNER_TEMP/borban-shopmanager-release.jks"

      - name: Build signed release APK
        env:
          BORBAN_KEYSTORE_PATH: ${{ runner.temp }}/borban-shopmanager-release.jks
          BORBAN_KEYSTORE_PASSWORD: ${{ secrets.BORBAN_ANDROID_KEYSTORE_PASSWORD }}
          BORBAN_KEY_ALIAS: ${{ secrets.BORBAN_ANDROID_KEY_ALIAS }}
          BORBAN_KEY_PASSWORD: ${{ secrets.BORBAN_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleRelease

      - name: Verify APK signature
        env:
          EXPECTED_CERT_SHA256: 14ea854648998f13af61f9d16a3c81e1555c95ed70b3c1764c286c292109bc75
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "Unexpected signing certificate: $ACTUAL_CERT_SHA256"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Borban-ShopManager-0.2.1-Premium-Signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/borban-shopmanager-release.jks"
